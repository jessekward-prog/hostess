<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workbench · Hostess</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --s-font: 'JetBrains Mono', 'Fira Mono', ui-monospace, Menlo, Consolas, monospace;
    --s-bg: #000000; --s-surface: #111111; --s-surface-2: #1e1e1e; --s-border: #333333;
    --s-accent: #ffffff;
    --s-text-0: #ffffff; --s-text-1: #b0b0b0; --s-text-3: #8a8a8a;
    --fs-xs: 11px; --fs-sm: 12px; --fs-md: 13px; --fs-base: 14px; --fs-xl: 17px;
    --ok: #3fb37f; --warn: #e0a53f; --danger: #e0564f;
    --crt-green: #3dff7a; --crt-green-rgb: 61,255,122;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--s-bg); color: var(--s-text-1); font: var(--fs-base)/1.5 var(--s-font); -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: none; background: none; padding: 0; }
  button:disabled { cursor: default; opacity: 0.45; }
  :focus-visible { outline: 2px solid var(--s-accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }

  .app { position: relative; display: grid; grid-template-rows: auto 1fr auto; grid-template-columns: minmax(0, 1fr); height: 100dvh; }
  /* The dashboard's chosen sidebar theme (bg-themes.js) paints behind everything; the bars sit above it. */
  .app > :not(canvas) { position: relative; z-index: 1; }
  .app > header.top { z-index: 3; } /* above the stage, so the recent-folders menu overlaps the previews */
  header.top { display: flex; align-items: center; gap: 12px; padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--s-border); background: var(--s-surface); flex-wrap: wrap; }
  .back { display: inline-flex; align-items: center; gap: 6px; color: var(--s-text-3); text-decoration: none; font-size: var(--fs-sm); min-height: 44px; }
  .back:hover { color: var(--s-text-0); }
  .brand { color: var(--s-text-0); font-size: var(--fs-xl); font-weight: 600; letter-spacing: 0.02em; }
  .brand .caret { color: var(--crt-green); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .folder { flex: 1; min-width: 240px; display: flex; gap: 8px; }
  .field { position: relative; flex: 1; min-width: 0; display: flex; }
  .folder input { flex: 1; min-width: 0; height: 44px; padding: 0 88px 0 12px; border-radius: 8px; border: 1px solid var(--s-border); background: var(--s-bg); color: var(--s-text-0); font-size: var(--fs-md); }
  .folder input:focus { outline: none; border-color: var(--s-text-3); }
  /* Watch toggle inside the address bar: open eye = this folder is live, click to stop. */
  .eye { position: absolute; top: 0; right: 0; bottom: 0; width: 44px; display: grid; place-items: center; border-radius: 0 8px 8px 0; color: var(--s-text-3); transition: color 0.15s, transform 0.1s; }
  /* CRT phosphor: dim green when off, bright with bloom and a faint flicker when watching. */
  .eye { color: rgba(var(--crt-green-rgb),0.38); }
  .eye:hover { color: rgba(var(--crt-green-rgb),0.7); }
  .eye:active { transform: scale(0.92); }
  .eye[aria-pressed="true"] { color: var(--crt-green); filter: drop-shadow(0 0 3px rgba(var(--crt-green-rgb),0.9)) drop-shadow(0 0 9px rgba(var(--crt-green-rgb),0.45)); animation: phosphor 3.2s steps(1) infinite; }
  @keyframes phosphor { 0%, 100% { opacity: 1; } 47% { opacity: 0.86; } 48% { opacity: 1; } 83% { opacity: 0.93; } 84% { opacity: 1; } }
  .eye svg { width: 18px; height: 18px; }
  .eye .on, .eye[aria-pressed="true"] .off { display: none; }
  /* Recent folders: a menu under the address bar. */
  .chev { position: absolute; top: 0; bottom: 0; right: 44px; width: 40px; display: grid; place-items: center; color: var(--s-text-3); }
  .chev:hover, .chev[aria-expanded="true"] { color: var(--s-text-0); }
  .chev svg { width: 16px; height: 16px; transition: transform 0.2s var(--ease); }
  .chev[aria-expanded="true"] svg { transform: rotate(180deg); }
  .recent { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 60; max-height: min(420px, 60vh); overflow-y: auto; padding: 6px; border-radius: 10px; background: var(--s-surface); border: 1px solid var(--s-border); box-shadow: 0 16px 44px rgba(0,0,0,0.65); animation: drop 0.18s var(--ease); }
  @keyframes drop { from { opacity: 0; transform: translateY(-4px); } }
  .recent-head { padding: 6px 10px 8px; font-size: var(--fs-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--s-text-3); }
  .recent-empty { padding: 10px; font-size: var(--fs-sm); color: var(--s-text-3); }
  .recent-row { display: flex; align-items: stretch; border-radius: 8px; }
  .recent-row:hover, .recent-row.hi { background: var(--s-surface-2); }
  .recent-pick { flex: 1; min-width: 0; display: grid; grid-template-columns: 32px 1fr auto; column-gap: 12px; align-items: center; padding: 8px 10px; min-height: 48px; text-align: left; }
  .recent-logo { grid-row: 1 / 3; position: relative; width: 32px; height: 32px; border-radius: 8px; background: var(--s-surface-2); box-shadow: 0 0 0 1px var(--s-border); display: grid; place-items: center; color: var(--s-text-1); font-size: var(--fs-md); text-transform: uppercase; }
  .recent-logo img { width: 100%; height: 100%; object-fit: contain; border-radius: 8px; }
  .recent-row.live .recent-logo::after { content: ''; position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--crt-green); box-shadow: 0 0 0 2px var(--s-surface), 0 0 6px rgba(var(--crt-green-rgb),0.8); }
  .recent-pick b { color: var(--s-text-0); font-weight: 500; font-size: var(--fs-md); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recent-pick small { grid-column: 2; color: var(--s-text-3); font-size: var(--fs-xs); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .recent-pick time { grid-row: 1; grid-column: 3; color: var(--s-text-3); font-size: var(--fs-xs); }
  .recent-x { width: 40px; flex-shrink: 0; color: var(--s-text-3); border-radius: 8px; }
  .recent-x:hover { color: #ff8a84; }
  .eye[aria-pressed="true"] .on { display: block; }
  .btn { height: 44px; padding: 0 16px; border-radius: 8px; background: var(--s-accent); color: #000; font-weight: 600; font-size: var(--fs-md); transition: transform 0.1s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(0.97); }
  .btn.ghost { background: transparent; color: var(--s-text-1); border: 1px solid var(--s-border); }
  .btn.ghost:hover:not(:disabled) { border-color: var(--s-text-3); color: var(--s-text-0); }
  /* Fixed width so the header never shifts as the label changes. */
  .status { display: inline-flex; align-items: center; gap: 8px; width: 170px; font-size: var(--fs-sm); color: var(--s-text-3); white-space: nowrap; overflow: hidden; }
  /* Ticker tape: a label too long for the box scrolls continuously (two copies, shifted by half). */
  .ticker { flex: 1; min-width: 0; overflow: hidden; }
  .ticker.over { -webkit-mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 14px), transparent); mask-image: linear-gradient(90deg, transparent, #000 10px, #000 calc(100% - 14px), transparent); }
  #statusText { display: inline-block; white-space: nowrap; }
  #statusText.run { animation: ticker var(--dur, 8s) linear infinite; }
  #statusText.run span { padding-right: 3em; }
  @keyframes ticker { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) { #statusText.run { animation: none; } }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-border); }
  .status[data-s="running"] .dot { background: var(--ok); }
  .status[data-s="building"] .dot { background: var(--crt-green); box-shadow: 0 0 8px rgba(var(--crt-green-rgb),0.7); animation: pulse 1s ease-in-out infinite; }
  .status[data-s="error"] .dot { background: var(--danger); }
  .status[data-s="error"] { color: #ff8a84; }
  @keyframes pulse { 50% { opacity: 0.35; } }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }

  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2.4fr); gap: 16px; padding: 16px; min-height: 0; }
  .view { display: flex; flex-direction: column; min-height: 0; min-width: 0; gap: 8px; }
  .view-head { display: flex; align-items: center; gap: 8px; font-size: var(--fs-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--s-text-3); }
  .view-head a { margin-left: auto; color: var(--s-text-3); text-transform: none; letter-spacing: 0; }
  .view-head a:hover { color: var(--s-text-0); }
  .view-head a[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
  .fit { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  /* The device is laid out at its real size and scaled to fit, so the app sees a true 390px / 1280px viewport. */
  .device { position: absolute; left: 50%; top: 0; transform-origin: top center; border-radius: 12px; overflow: hidden; background: var(--s-surface); box-shadow: 0 0 0 1px var(--s-border), 0 10px 30px rgba(0,0,0,0.5); }
  .device iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; transition: opacity 0.18s; }
  .device iframe.back { opacity: 0; pointer-events: none; }
  /* Loading placeholder: the dashboard's ripple field (crt-monitor.js) with a flashing LOADING, under a frame
     that stays hidden until the app has loaded, so a preview is never a blank white box. */
  .loading-ph { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--s-bg); }
  .loading-word { position: relative; z-index: 1; font-family: Georgia, 'Times New Roman', serif; font-size: 22px; letter-spacing: 0.4em; padding-left: 0.4em; color: var(--ok); text-shadow: 0 0 10px rgba(63,179,127,0.55); animation: loading-flash 1.1s ease-in-out infinite; }
  .device[data-w="1280"] .loading-word { font-size: 34px; }
  @media (prefers-reduced-motion: reduce) { .loading-word { animation: none; } }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--s-text-3); font-size: var(--fs-md); background: var(--s-bg); }


  /* Prompt builder, docked along the bottom: Before (what you typed) → After (the local AI's rewrite). */
  .dock { border-top: 1px solid var(--s-border); background: var(--s-surface); padding: 0 16px max(12px, env(safe-area-inset-bottom)); }
  .dock-head { display: flex; align-items: center; gap: 12px; min-height: 44px; }
  .dock-toggle { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--s-text-0); font-size: var(--fs-md); font-weight: 600; }
  .dock-toggle svg { width: 14px; height: 14px; color: var(--s-text-3); transition: transform 0.2s var(--ease); }
  .dock-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
  #refineStatus { font-size: var(--fs-xs); color: var(--s-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #refineStatus.bad { color: #ff8a84; }
  .side textarea.bad::placeholder { color: #ff8a84; opacity: 1; }
  .dock-head .hint { flex: 1; min-width: 0; font-size: var(--fs-xs); color: var(--s-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .dock-body { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; height: 200px; }
  .dock-body[hidden] { display: none; }
  .side { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .side-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
  .side-head label { flex: 1; font-size: var(--fs-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--s-text-3); }
  .side-head label b { color: var(--s-text-1); font-weight: 600; }
  .side textarea { flex: 1; min-height: 0; width: 100%; resize: none; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--s-border); background: var(--s-bg); color: var(--s-text-0); font-size: var(--fs-md); line-height: 1.5; }
  .side textarea:focus { outline: none; border-color: var(--s-text-3); }
  #refined { font-size: var(--fs-sm); }
  .after-box { position: relative; flex: 1; min-height: 0; display: flex; }
  .after-box textarea { flex: 1; }
  .side .btn.small { height: 28px; padding: 0 10px; font-size: var(--fs-xs); }
  .mid { display: flex; flex-direction: column; justify-content: center; }
  #refineBtn { display: inline-flex; align-items: center; gap: 6px; }
  /* Launch to Hostess: bottom-right of the preview area. */
  .launch { position: absolute; right: 16px; bottom: 16px; z-index: 4; display: flex; align-items: center; gap: 12px; }
  .launch a { font-size: var(--fs-sm); color: var(--crt-green); text-shadow: 0 0 8px rgba(var(--crt-green-rgb),0.45); }
  .launch a[hidden] { display: none; }
  #launchBtn { display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 28px rgba(0,0,0,0.55); }
  #launchBtn svg { width: 16px; height: 16px; }
  .stage-wrap { position: relative; display: grid; min-height: 0; }

  .tabs { display: none; }
  @media (max-width: 899px) {
    .tabs { display: flex; gap: 6px; }
    .tabs button { height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--s-border); font-size: var(--fs-sm); color: var(--s-text-3); }
    .tabs button[aria-selected="true"] { color: var(--s-text-0); border-color: var(--s-text-3); }
    .stage { grid-template-columns: 1fr; }
    .dock-body { grid-template-columns: 1fr; height: auto; }
    .side textarea { height: 80px; flex: none; }
    .after-box { flex: none; height: 176px; } /* room for the progress monitor */
    .after-box textarea { height: auto; }
    .mid { flex-direction: row; }
    #refineBtn { flex: 1; justify-content: center; }
    .folder { flex-basis: 100%; min-width: 0; order: 1; }
    .status { order: 2; flex: 1; width: auto; min-width: 0; }
    #rebuildBtn { order: 3; }
    .tabs { order: 4; flex-basis: 100%; }
    .tabs button { flex: 1; }
    .view:not(.active) { display: none !important; }
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="bg-gain" color-interpolation-filters="sRGB"><feComponentTransfer><feFuncA id="bg-gain-a" type="linear" slope="1"/></feComponentTransfer></filter></svg>
<div class="app">

        <div class="recent" id="recentMenu" hidden></div>
        <button class="eye" type="button" id="eyeBtn" aria-pressed="false" aria-label="Watch this folder" title="Watch this folder">
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
          <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>

<script src="/crt-monitor.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// Same theme and intensity as the dashboard sidebar (its THEME panel saves them in localStorage).
(() => {
  const load = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
  const intensity = parseFloat(load('hostess-bg-int'));
  document.getElementById('bg-gain-a').setAttribute('slope', Number.isFinite(intensity) ? intensity : 0.5);
  mountBackground(document.querySelector('.app'), BG_THEMES[load('hostess-bg')] ? load('hostess-bg') : 'ascii');
})();
const api = async (url, opts = {}) => {
  const r = await fetch(url, { ...opts, headers: { 'Content-Type': 'application/json' } });
  const body = await r.json().catch(() => ({}));
  if (r.status === 401) location.href = '/';
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
};
let current = { status: 'idle' };
const devices = [...document.querySelectorAll('.device')];

// Scale each device to fit its slot (ResizeObserver, not a hardcoded size, so it tracks every layout).
const ro = new ResizeObserver(() => devices.forEach(fit));
function fit(d) {
  const box = d.parentElement.getBoundingClientRect();
  const w = +d.dataset.w, h = +d.dataset.h;
  const s = Math.min(box.width / w, box.height / h, 1);
  Object.assign(d.style, { width: w + 'px', height: h + 'px', transform: `translateX(-50%) scale(${s})` });
}
devices.forEach((d) => { ro.observe(d.parentElement); fit(d); });

function appUrl() { return `${location.protocol}//${location.hostname}:${current.port}/`; }

// Double-buffered: the new page loads behind the old one and swaps in once it has loaded, so a
// reload never flashes white.
function placeholder(d) {
  if (d.querySelector('.loading-ph')) return;
  const el = Object.assign(document.createElement('div'), { className: 'loading-ph', innerHTML: '<span class="loading-word">LOADING</span>' });
  d.appendChild(el); // on the page first: the ripple sizes itself from the element and skips its first ring at 0×0
  el._stop = mountRippleField(el, RIPPLE_COLOR.ok, { scale: 1, speed: 120 });
}
function clearDevice(d, keep) {
  for (const x of [...d.children]) if (x !== keep) { if (x._stop) x._stop(); x.remove(); }
}

// Double-buffered: a new page always loads hidden, behind the old page or the loading placeholder, and
// swaps in once loaded, so a reload never flashes white.
function show() {
  const live = current.port && current.status !== 'idle';
  $('openLink').setAttribute('aria-disabled', !live);
  if (live) $('openLink').href = appUrl(); else $('openLink').removeAttribute('href');
  for (const d of devices) {
    if (!live) { clearDevice(d); d.insertAdjacentHTML('beforeend', `<div class="empty">${current.status === 'idle' ? 'Nothing to show yet' : ''}</div>`); continue; }
    const old = d.querySelector('iframe:not(.back)');
    if (!old) { d.querySelectorAll('.empty').forEach((x) => x.remove()); placeholder(d); }
    if (current.status !== 'running') continue;
    d.querySelectorAll('iframe.back').forEach((x) => x.remove()); // a newer reload supersedes one still loading
    const f = document.createElement('iframe');
    f.title = `${d.dataset.w}px preview`;
    f.className = 'back';
    f.src = appUrl();
    let done = false;
    // isConnected: a newer reload removed this frame, so it must not clear the device.
    const reveal = () => { if (done || !f.isConnected) return; done = true; f.className = ''; clearDevice(d, f); };
    // A short beat after load lets the app's own script paint; the timeout covers a page whose load never fires.
    f.onload = () => setTimeout(reveal, 150);
    setTimeout(reveal, 20000);
    d.appendChild(f);
  }
}

// Fits the status label, or turns it into a ticker when it's wider than its box. Only redone when the
// label or the box width changes, so a steady label keeps scrolling smoothly through re-renders.
let statusLabel = '', statusBoxW = 0;
function setStatusLabel(label, force) {
  const clip = $('statusClip'), t = $('statusText');
  if (label === statusLabel && !force) return;
  statusLabel = label;
  statusBoxW = clip.clientWidth;
  t.classList.remove('run');
  t.textContent = label;
  t.title = label;
  const over = t.offsetWidth > clip.clientWidth + 1;
  clip.classList.toggle('over', over);
  if (!over) return;
  t.replaceChildren(...[0, 1].map(() => Object.assign(document.createElement('span'), { textContent: label })));
  t.style.setProperty('--dur', `${Math.max(5, t.offsetWidth / 2 / 28)}s`); // ~28px per second
  t.classList.add('run');
}
new ResizeObserver(() => { if (statusLabel && $('statusClip').clientWidth !== statusBoxW) setStatusLabel(statusLabel, true); }).observe($('statusClip'));

function render(s) {
  const prev = current;
  current = { ...current, ...s };
  const label = { idle: 'Not watching', building: 'Building…', running: `Live · ${current.name || ''}`, error: current.error || 'Failed' }[current.status];
  $('status').dataset.s = current.status;
  setStatusLabel(label);
  // Controls stay put and grey out when there's nothing to act on, so the header never reflows.
  $('rebuildBtn').disabled = current.status === 'idle' || current.mode === 'static';
  if (!refining) $('refineBtn').disabled = current.status === 'idle'; // the rewrite describes the watched app
  // Launching needs a live Docker preview (a plain HTML folder has no app.yaml to install from).
  if (!launching) $('launchBtn').disabled = !(current.status === 'running' && current.mode === 'docker');
  if (current.dir && document.activeElement !== $('dir')) $('dir').value = current.dir;
  syncEye();
  if (prev.status !== current.status && current.status !== 'running') show();
}

// Load screen: the dashboard's CRT deploy monitor (crt-monitor.js), fed by the build's plan/step/log
// events. It opens when you start watching a folder and whenever a build fails; a rebuild after a save
// otherwise runs quietly behind the status label, with the old preview still showing.
let wbActive = null, loading = false, lastPlan = [], logTail = [], userStopped = false;
const cine = crtMonitor({ activeId: () => wbActive });
const planLabel = (id) => (lastPlan.find((st) => st.id === id) || {}).label || '';
function addLog(line) {
  logTail.push(line);
  if (logTail.length > 40) logTail.shift();
  cine.line(line);
}
function showFailure(msg) {
  if (!loading) {
    cine.open('Rebuilding');
    cine.plan(lastPlan);
    // Steps before the one that failed went through.
    for (const st of [{ id: 'read' }, ...lastPlan]) { if (st.id === wbActive) break; cine.step(st.id, { state: 'done' }); }
    for (const l of logTail.slice(-12)) cine.line(l);
  }
  loading = false;
  cine.fail(msg);
}

const events = new EventSource('/api/workbench/events');
events.onmessage = (e) => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'state') {
    const was = current.status;
    // A full snapshot (has log) arrives on every (re)connect. Idle while this page was watching a folder means
    // Hostess restarted (an update, say): pick the same folder up again, unless you stopped it yourself.
    if (ev.state.log && ev.state.status === 'idle' && current.dir && current.status !== 'idle' && !userStopped) {
      $('dir').value = current.dir;
      setTimeout(() => $('folderForm').requestSubmit(), 0);
    }
    if (ev.state.log) logTail = ev.state.log.slice(-40);
    render(ev.state);
    if (ev.state.status === 'running' && ev.state.log) show();
    if (ev.state.status === 'error' && (was !== 'error' || ev.state.log)) showFailure(ev.state.error || 'The build failed.');
  } else if (ev.type === 'plan') {
    lastPlan = ev.steps;
    if (loading) { cine.step('read', { state: 'done' }); cine.plan(ev.steps); }
  } else if (ev.type === 'step') {
    if (ev.state === 'active') wbActive = ev.id;
    if (loading) cine.step(ev.id, ev, planLabel(ev.id));
  } else if (ev.type === 'log') {
    if (/^Building /.test(ev.line)) logTail = [];
    addLog(ev.line);
  } else if (ev.type === 'reload') {
    current.status = 'running';
    show();
    if (loading) { loading = false; cine.done(current.name || ''); }
  }
};

$('folderForm').onsubmit = async (e) => {
  e.preventDefault();
  loading = true; wbActive = 'read'; logTail = []; userStopped = false;
  cine.open('Reading the folder');
  try { render(await api('/api/workbench/start', { method: 'POST', body: JSON.stringify({ dir: $('dir').value }) })); }
  catch (err) { showFailure(err.message); }
};
// Open eye only while the folder in the box is the one being watched; editing the path closes it,
// so a click (or Enter) then switches to the new folder.
function syncEye() {
  const live = current.status !== 'idle' && $('dir').value.trim() === current.dir;
  $('eyeBtn').setAttribute('aria-pressed', live);
  const label = live ? 'Stop watching' : 'Watch this folder';
  $('eyeBtn').setAttribute('aria-label', label);
  $('eyeBtn').title = label;
}
$('dir').addEventListener('input', syncEye);
$('eyeBtn').onclick = () => {
  if ($('eyeBtn').getAttribute('aria-pressed') === 'true') { userStopped = true; api('/api/workbench/stop', { method: 'POST' }); }
  else $('folderForm').requestSubmit();
};
$('rebuildBtn').onclick = () => api('/api/workbench/rebuild', { method: 'POST' });

$('browseBtn').onclick = async () => {
  $('browseBtn').disabled = true;
  try {
    const { dir } = await api('/api/workbench/pick', { method: 'POST' });
    if (dir) { $('dir').value = dir; $('folderForm').requestSubmit(); }
  } catch (err) { cine.open('Opening the folder dialog'); cine.fail(err.message); }
  $('browseBtn').disabled = false;
};

document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.dataset.view === b.dataset.view));
  devices.forEach(fit);
});

// Prompt builder (POST /api/workbench/prompt streams the local AI's answer as it writes).
let refining = null;
function setDock(open) {
  $('dockBody').hidden = !open;
  $('dockToggle').setAttribute('aria-expanded', open);
  try { localStorage.setItem('workbench-dock', open ? 'open' : 'closed'); } catch {}
}
$('dockToggle').onclick = () => setDock($('dockBody').hidden);
// Open by default, except on a phone-width screen where it would squeeze the preview to a sliver.
{
  let saved = null;
  try { saved = localStorage.getItem('workbench-dock'); } catch {}
  if (saved === 'closed' || (!saved && matchMedia('(max-width: 899px)').matches)) { $('dockBody').hidden = true; $('dockToggle').setAttribute('aria-expanded', 'false'); }
}
try { $('ask').value = localStorage.getItem('workbench-ask') || ''; } catch {}
$('ask').addEventListener('input', () => { try { localStorage.setItem('workbench-ask', $('ask').value); } catch {} });
$('ask').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('refineBtn').click(); });

// The After box shows the stages in a small CRT monitor (crt-monitor.js, same as the load screen): it
// collapses when the first words arrive, and on a failure stays on the stage that stopped, with the reason.
let refineActive = null;
const AFTER_HINT = $('refined').placeholder; // the box's own explanation, put back after each run
const refineMon = crtMonitor({ activeId: () => refineActive, container: $('afterBox'), hideLabel: 'hide ×' });
const refineLabels = { read: 'Reading the app folder' };
$('refineBtn').onclick = async () => {
  if (refining) { refining.abort(); return; }
  const request = $('ask').value.trim();
  if (!request) { $('ask').focus(); return; }
  refining = new AbortController();
  $('refineBtn').textContent = 'Stop';
  $('refineBtn').disabled = false;
  $('refined').value = '';
  $('refined').classList.remove('bad');
  $('refined').placeholder = 'Writing…';
  $('refineStatus').classList.remove('bad');
  $('copyBtn').disabled = true;
  $('refineStatus').textContent = 'Asking your local AI…';
  refineActive = 'read';
  refineMon.open(refineLabels.read, 'read');
  const t0 = performance.now();
  try {
    const r = await fetch('/api/workbench/prompt', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ request }), signal: refining.signal });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === 'plan') { ev.steps.forEach((st) => { refineLabels[st.id] = st.label; }); refineMon.plan(ev.steps); }
        if (ev.type === 'step') {
          if (ev.state === 'active') refineActive = ev.id;
          refineMon.step(ev.id, ev, refineLabels[ev.id] || ev.id);
          if (ev.id === 'write' && ev.state === 'active') refineMon.close(); // the words take over the box
        }
        if (ev.type === 'log') refineMon.line(ev.line);
        if (ev.type === 'text') { $('refined').value += ev.text; $('refined').scrollTop = $('refined').scrollHeight; $('refineStatus').textContent = 'Writing…'; }
        if (ev.type === 'error') throw new Error(ev.error);
      }
    }
    $('refineStatus').textContent = `Done in ${((performance.now() - t0) / 1000).toFixed(1)}s`;
    $('refined').placeholder = AFTER_HINT;
  } catch (err) {
    const msg = err.name === 'AbortError' ? 'Stopped.' : err.message;
    $('refineStatus').textContent = msg;
    if (err.name === 'AbortError') { refineMon.close(); $('refined').placeholder = AFTER_HINT; } else refineMon.fail(msg);
    // Shown where the answer would have been, in red, so a failed press can't look like nothing happened.
    if (err.name !== 'AbortError' && !$('refined').value) { $('refined').placeholder = msg; $('refined').classList.add('bad'); $('refineStatus').classList.add('bad'); }
  }
  $('copyBtn').disabled = !$('refined').value.trim();
  $('refineBtn').innerHTML = 'Refine <span aria-hidden="true">→</span>';
  $('refineBtn').disabled = current.status === 'idle';
  refining = null;
};
$('refined').addEventListener('input', () => { $('copyBtn').disabled = !$('refined').value.trim(); });
$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText($('refined').value); }
  catch { $('refined').select(); document.execCommand('copy'); }
  $('copyBtn').textContent = 'Copied';
  setTimeout(() => { $('copyBtn').textContent = 'Copy'; }, 1500);
};

// Recent folders (newest first, kept by the server in settings.json). Picking one switches the single
// preview over to it; nothing else keeps running.
let recentList = [], recentHi = -1;
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'now' : m < 60 ? `${m}m` : m < 1440 ? `${Math.round(m / 60)}h` : `${Math.round(m / 1440)}d`; };
function drawRecent() {
  const menu = $('recentMenu');
  if (!recentList.length) { menu.innerHTML = '<div class="recent-empty">Folders you watch show up here.</div>'; return; }
  menu.replaceChildren(Object.assign(document.createElement('div'), { className: 'recent-head', textContent: 'Recent' }), ...recentList.map((r, i) => {
    const row = document.createElement('div');
    row.className = 'recent-row' + (current.status !== 'idle' && r.dir === current.dir ? ' live' : '') + (i === recentHi ? ' hi' : '');
    const pick = document.createElement('button');
    pick.type = 'button'; pick.className = 'recent-pick';
    pick.innerHTML = '<span class="recent-logo" aria-hidden="true"></span><b></b><time></time><small></small>';
    const logo = pick.querySelector('.recent-logo');
    logo.textContent = r.name[0] || '?';
    if (r.logo) {
      const img = Object.assign(new Image(), { alt: '', src: `/api/workbench/recent/logo?dir=${encodeURIComponent(r.dir)}&v=${r.at}` });
      img.onload = () => logo.replaceChildren(img); // keep the letter if the file won't load
    }
    pick.querySelector('b').textContent = r.name;
    pick.querySelector('small').textContent = `\u200E${r.dir}\u200E`; // LRM: rtl only moves the ellipsis to the left
    pick.querySelector('time').textContent = ago(r.at);
    pick.onclick = () => openRecent(r.dir);
    const x = document.createElement('button');
    x.type = 'button'; x.className = 'recent-x'; x.textContent = '×';
    x.setAttribute('aria-label', `Remove ${r.name} from recent`);
    x.onclick = async () => { recentList = await api('/api/workbench/recent', { method: 'DELETE', body: JSON.stringify({ dir: r.dir }) }); drawRecent(); };
    row.append(pick, x);
    return row;
  }));
}
async function setRecent(open) {
  $('recentMenu').hidden = !open;
  $('chevBtn').setAttribute('aria-expanded', open);
  if (!open) return;
  recentHi = -1;
  drawRecent();
  try { recentList = (await api('/api/workbench')).recent || []; drawRecent(); } catch {}
}
function openRecent(dir) {
  setRecent(false);
  $('dir').value = dir;
  if (!(current.status !== 'idle' && dir === current.dir)) $('folderForm').requestSubmit();
  syncEye();
}
$('chevBtn').onclick = () => setRecent($('recentMenu').hidden);
$('dir').addEventListener('focus', () => setRecent(true));
$('dir').addEventListener('keydown', (e) => {
  const open = !$('recentMenu').hidden;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!open) return setRecent(true);
    const n = recentList.length;
    if (!n) return;
    recentHi = e.key === 'ArrowDown' ? (recentHi + 1) % n : recentHi <= 0 ? n - 1 : recentHi - 1;
    drawRecent();
  } else if (e.key === 'Enter' && open && recentHi >= 0) {
    e.preventDefault(); openRecent(recentList[recentHi].dir);
  } else if (e.key === 'Escape') setRecent(false);
  else if (e.key !== 'Tab') setRecent(false); // typing a path of your own
});
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.field')) setRecent(false); });

// Launch to Hostess: the compliance checks and then the real install, played in the same CRT monitor as the
// load screen. If the app's name is already installed from somewhere else, the first press explains and the
// second replaces it.
let launching = false, replaceOk = false;
function launchLabel(text) { $('launchBtn').querySelector('span').textContent = text; }
$('launchBtn').onclick = async () => {
  if (launching) return;
  launching = true;
  $('launchBtn').disabled = true;
  $('launchedLink').hidden = true;
  launchLabel('Launching…');
  const labels = { 'c-ready': 'Getting ready' };
  wbActive = 'c-ready';
  cine.open(labels['c-ready'], 'c-ready');
  let confirm = false, firstFailed = null;
  try {
    const r = await fetch('/api/workbench/launch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ replace: replaceOk }) });
    if (r.status === 401) { location.href = '/'; return; }
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', finished = false;
    while (!finished) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        if (!p.startsWith('data: ')) continue;
        const ev = JSON.parse(p.slice(6));
        if (ev.type === 'plan') { ev.steps.forEach((st) => { labels[st.id] = st.label; }); cine.step('c-ready', { state: 'done' }); cine.plan(ev.steps); }
        else if (ev.type === 'step') {
          // Once a step finishes it is no longer "the one running", so a later error doesn't paint it red.
          if (ev.state === 'active') wbActive = ev.id; else if (wbActive === ev.id) wbActive = null;
          if (ev.state === 'failed' && !firstFailed) firstFailed = ev.id;
          cine.step(ev.id, ev, labels[ev.id] || ev.id);
        }
        else if (ev.type === 'log') cine.line(ev.line, /^✗/.test(ev.line));
        else if (ev.type === 'confirm') { confirm = true; cine.fail(ev.error); finished = true; }
        else if (ev.type === 'error') { if (firstFailed) wbActive = firstFailed; cine.fail(ev.error); finished = true; }
        else if (ev.type === 'done') {
          finished = true;
          $('launchedLink').href = `${location.protocol}//${location.hostname}:${ev.port}/`;
          $('launchedLink').hidden = false;
          await cine.done(ev.name);
        }
      }
    }
  } catch (err) { cine.fail(err.message); }
  replaceOk = confirm;
  launchLabel(confirm ? 'Replace it on Hostess' : 'Launch to Hostess');
  launching = false;
  $('launchBtn').disabled = !(current.status === 'running' && current.mode === 'docker');
};

// Pick up where it left off: the last folder starts watching again on open.
api('/api/workbench').then((s) => {
  if (s.status === 'idle' && s.remembered) { $('dir').value = s.remembered; $('folderForm').requestSubmit(); }
}).catch(() => {});
</script>
</body>
</html>
